<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-label="萧赜 冠服考据复原像">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F7F2E4"/>
      <stop offset="0.55" stop-color="#F1E9D6"/>
      <stop offset="1" stop-color="#E8DEC6"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A39681" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A39681" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="34%" r="52%">
      <stop offset="0" stop-color="#7B6172" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7B6172" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#4B4A5C" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#4B4A5C" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="weave" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6B5B42" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="0.4"/></filter>
  </defs>

  <!-- 裱边（绫） -->
  <rect x="0" y="0" width="440" height="620" fill="url(#silk)"/>
  <rect x="0" y="0" width="440" height="620" fill="url(#weave)"/>
  <!-- 画心 -->
  <rect x="34" y="34" width="372" height="552" fill="url(#paper)"/>
  <rect x="34" y="34" width="372" height="552" fill="url(#halo)"/>
  <rect x="40" y="40" width="360" height="540" fill="none" stroke="#A39681" stroke-width="0.9" opacity="0.85"/>
  <rect x="46" y="46" width="348" height="528" fill="none" stroke="#A39681" stroke-width="0.5" opacity="0.55"/>

  <g stroke-linejoin="round">
    <!-- 衣袍 -->
    <path d="M200 268 C142 276 96 314 82 470 C76 528 74 560 74 574 L326 574 C326 560 324 528 318 470 C304 314 258 276 200 268 Z" fill="url(#robeGrad)"/>
    <!-- 衣纹 -->
    <g stroke="#241E17" stroke-width="0.9" opacity="0.35" fill="none">
      <path d="M120 360 C132 420 130 500 126 570"/>
      <path d="M152 340 C160 410 158 500 156 570"/>
      <path d="M248 340 C240 410 242 500 244 570"/>
      <path d="M280 360 C268 420 270 500 274 570"/>
    </g>
    <!-- 交领右衽 -->
    <path d="M200 270 L164 300 L200 336 L236 300 Z" fill="#EFE6D2" opacity="0.92"/>
    <path d="M200 270 L164 300 L200 470 L200 336 Z" fill="#E4D8BE" opacity="0.75"/>
    <path d="M164 300 L200 470" stroke="#241E17" stroke-width="1.6" opacity="0.55" fill="none"/>
    <path d="M236 300 L200 470" stroke="#241E17" stroke-width="1.4" opacity="0.45" fill="none"/>
    <path d="M150 306 C160 390 176 470 200 512 C224 470 240 390 250 306" fill="none" stroke="#7B6172" stroke-width="5" opacity="0.55"/>
    <!-- 胸前团花补子 -->
    <circle cx="200" cy="392" r="22" fill="none" stroke="#7B6172" stroke-width="1" opacity="0.45"/>
    <!-- 腰带 -->
    <path d="M96 470 C140 486 260 486 304 470 L306 496 C260 512 140 512 94 496 Z" fill="#2E2822" opacity="0.82"/>
    <rect x="182" y="472" width="36" height="26" rx="3" fill="#7B6172" opacity="0.72"/>

    <!-- 颈 -->
    <path d="M178 244 L178 280 C178 292 222 292 222 280 L222 244 Z" fill="#E8D3B8"/>
    <path d="M178 262 C188 274 212 274 222 262" fill="none" stroke="#B99B78" stroke-width="1.4" opacity="0.7"/>

    <!-- 耳 -->
    <ellipse cx="149" cy="220" rx="7" ry="12" fill="#E8D3B8"/>
    <ellipse cx="251" cy="220" rx="7" ry="12" fill="#E8D3B8"/>

    <!-- 面 -->
    <path d="M200 146 C249 156 249 238 200 260 C151 238 151 156 200 146 Z" fill="#EFDCC2"/>
    <!-- 面部明暗 -->
    <path d="M200 156 C249 160 249 238 200 258" fill="#E6CFB0" opacity="0.5"/>
    <!-- 发际 -->
    <path d="M153 176 C170 150 230 150 247 176 C224 164 176 164 153 176 Z" fill="#221C18" opacity="0.9"/>

    <!-- 眉 -->
    <path d="M155 179 q20 -7 38 -4" fill="none" stroke="#2A231B" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M245 179 q-20 -7 -38 -4" fill="none" stroke="#2A231B" stroke-width="3.4" stroke-linecap="round"/>

    <!-- 目 -->
    <path d="M157 198 q12 -8 26 0 q-13 7 -26 0 Z" fill="#FBF6EA" stroke="#2A231B" stroke-width="1.5"/>
    <path d="M217 198 q12 -8 26 0 q-13 7 -26 0 Z" fill="#FBF6EA" stroke="#2A231B" stroke-width="1.5"/>
    <circle cx="170" cy="198" r="3.2" fill="#241E18"/>
    <circle cx="230" cy="198" r="3.2" fill="#241E18"/>
    <path d="M157 198 q13 6 26 0" fill="none" stroke="#2A231B" stroke-width="1" opacity="0.5"/>
    <path d="M217 198 q13 6 26 0" fill="none" stroke="#2A231B" stroke-width="1" opacity="0.5"/>

    <!-- 鼻 -->
    <path d="M200 202 L197 224 q4 3 8 0" fill="none" stroke="#A98862" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 口 -->
    <path d="M190 236 q10 5 20 0" fill="none" stroke="#9C4A3E" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M190 236 q10 -3 20 0" fill="none" stroke="#9C4A3E" stroke-width="1" opacity="0.5"/>

    <path d="M188 226 q12 4 24 0" stroke="#26221C" stroke-width="2" fill="none"/>
    
      <g>
        <path d="M154 164 C154 126 174 108 200 108 C226 108 246 126 246 164 Z" fill="#1E2228"/>
        <rect x="176" y="104" width="48" height="22" rx="6" fill="#2A3038"/>
        <path d="M176 116 L160 108 M224 116 L240 108" stroke="#2A3038" stroke-width="4"/>
      </g>
  </g>

  <!-- 侧题（竖排） -->
  <g font-family="Songti SC, SimSun, serif" fill="#4A3E2E" opacity="0.82">
    <text x="358" y="112" font-size="15" writing-mode="tb">萧赜</text>
    
  </g>

  <!-- 印章 -->
  <g transform="translate(58 512) rotate(-1.2)" font-family="Songti SC, SimSun, serif">
    <rect x="0" y="0" width="64" height="64" rx="3" fill="#B03A2E" opacity="0.9"/>
    <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#F7F2E4" stroke-width="1.2" opacity="0.85"/>
    <g fill="#F7F2E4" text-anchor="middle" font-weight="700"><text x="26" y="30" font-size="17">萧</text><text x="44" y="30" font-size="17">赜</text></g>
  </g>

  <!-- 落款 -->
  <text x="358" y="566" font-size="8.5" font-family="Songti SC, SimSun, serif" fill="#6B5B42" opacity="0.6" text-anchor="end">华夏史网 · 冠服考据复原 · 南北朝</text>
</svg>